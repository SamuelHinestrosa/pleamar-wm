# pleamar-wm's key bindings. Yours go in ~/.config/pleamar/keys.conf: start it
# with `defaults` to keep these and change or add below, or write all of yours.
#
#   bind  Mods+key  action          an action of the window manager (below)
#   bind  Mods+key  launch COMMAND  a program
#   bind  key repeat locked …       held, it acts again; and it acts with the screen locked
#   unbind Mods+key                 one of these, gone
#   gesture NAME  action            touchpad: swipe3_up/down/left/right, swipe4_…, pinch3_in/out
#   shortcut [app:]ID Mods+key      a program's global shortcut (push to talk…), on
#                                   that key instead of the one it asked for
#
# Modifiers: Super Ctrl Alt Shift, in any order. The key by its name: q, Return,
# space, Left, Print, minus, plus, F5… (as `wev` or `xev` say it).
#
# The actions are the events the window manager's scene declares: these for the
# one that comes with it; a scene of your own (~/.config/pleamar/wm/session.plm)
# brings its own.
#   close  minimize  restore_last  fullscreen  toggle_free  overview
#   focus_next  focus_previous  move_left  move_right  move_up  move_down
#   narrower  wider  workspace_next  workspace_previous
#   workspace N  move_to_workspace N   (with the number: `bind Super+3 workspace 3`)

# Programs.
bind Super+Return      launch kitty
bind Super+t           launch kitty
bind Super+space       launch marea search
bind Super+l           launch marea lock
bind Print             launch marea shot_region
bind Shift+Print       launch marea shot_screen
bind Ctrl+Print        launch marea shot_window
bind Super+c           launch marea shot_region
bind Super+Shift+c     launch marea record_toggle

# The keyboard's own keys: through Marea, who shows the volume as it changes.
# `repeat` acts again while held; `locked`, with the screen locked too.
bind XF86AudioRaiseVolume   repeat locked launch marea volume_up
bind XF86AudioLowerVolume   repeat locked launch marea volume_down
bind XF86AudioMute          locked launch marea mute_output
bind XF86AudioMicMute       locked launch marea mute_mic
bind XF86MonBrightnessUp    repeat locked launch marea bright_up
bind XF86MonBrightnessDown  repeat locked launch marea bright_down
bind XF86AudioPlay          locked launch marea play_pause
bind XF86AudioPause         locked launch marea play_pause
bind XF86AudioNext          locked launch marea next
bind XF86AudioPrev          locked launch marea previous

# Windows.
bind Super+q           close
bind Super+m           minimize
bind Super+Shift+m     restore_last
bind Super+f           fullscreen
bind Super+w           toggle_free
bind Super+Tab         overview

# The keyboard to the next window, or the one before.
bind Super+Right       focus_next
bind Super+Down        focus_next
bind Super+Left        focus_previous
bind Super+Up          focus_previous

# Moving the one with the keyboard: left leads (or goes to the left monitor if
# it already leads), right goes to the right monitor, up and down in the order.
bind Super+Shift+Left  move_left
bind Super+Shift+Right move_right
bind Super+Shift+Up    move_up
bind Super+Shift+Down  move_down

# The leader narrower or wider.
bind Super+minus       narrower
bind Super+plus        wider

# The touchpad, as on Hyprland.
gesture swipe3_down    close
gesture swipe3_up      fullscreen
gesture swipe4_left    focus_previous
gesture swipe4_right   focus_next

# Workspaces: Super+1…9 shows one on the monitor under the mouse,
# Super+Shift+1…9 sends the window with the keyboard there.
bind Super+1           workspace 1
bind Super+2           workspace 2
bind Super+3           workspace 3
bind Super+4           workspace 4
bind Super+5           workspace 5
bind Super+6           workspace 6
bind Super+7           workspace 7
bind Super+8           workspace 8
bind Super+9           workspace 9
bind Super+Shift+1     move_to_workspace 1
bind Super+Shift+2     move_to_workspace 2
bind Super+Shift+3     move_to_workspace 3
bind Super+Shift+4     move_to_workspace 4
bind Super+Shift+5     move_to_workspace 5
bind Super+Shift+6     move_to_workspace 6
bind Super+Shift+7     move_to_workspace 7
bind Super+Shift+8     move_to_workspace 8
bind Super+Shift+9     move_to_workspace 9
bind Super+Ctrl+Right  workspace_next
bind Super+Ctrl+Left   workspace_previous
