# The portals in pleamar-wm's session (XDG_CURRENT_DESKTOP=pleamar): sharing
# the screen is the session's own (pleamar.portal, answered by pleamar-wm);
# screenshots through wlr-screencopy, which Hyprland's portal speaks;
# everything else (files, settings), GTK's.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=pleamar
org.freedesktop.impl.portal.Screenshot=hyprland
