# The portals in pleamar-wm's session (XDG_CURRENT_DESKTOP=pleamar): sharing
# the screen and screenshots are the session's own (pleamar.portal, answered
# by pleamar-wm); everything else (files, settings), GTK's.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=pleamar
org.freedesktop.impl.portal.Screenshot=pleamar
