# The portals in pleamar-wm's session (XDG_CURRENT_DESKTOP=pleamar): sharing
# the screen and screenshots go through wlr-screencopy, which Hyprland's
# portal speaks; everything else (files, settings), GTK's.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
